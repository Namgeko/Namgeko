<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="roundedCanvas">
      <rect x="0" y="0" width="1200" height="420" rx="16"/>
    </clipPath>

    <!-- misty background -->
    <linearGradient id="mist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a4d57"/>
      <stop offset="45%" stop-color="#26343c"/>
      <stop offset="100%" stop-color="#141d22"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#bcd6de" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#7ea3ae" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7ea3ae" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>

    <!-- glass avatar tile -->
    <linearGradient id="glassTile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eef6f8" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#aebfc6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5c6f77" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>

    <!-- glass pill fields -->
    <linearGradient id="fieldGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4fafc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c7d6db" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="badgeGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcecf1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8fa8b0" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="arrowBtn" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#7fc2da"/>
      <stop offset="100%" stop-color="#3a7c96"/>
    </radialGradient>

    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="lightBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <g clip-path="url(#roundedCanvas)">
    <rect x="0" y="0" width="1200" height="420" fill="url(#mist)"/>

    <!-- soft light shafts, like sun through fog -->
    <g filter="url(#softBlur)" opacity="0.55">
      <polygon points="60,-40 220,-40 430,460 250,460" fill="#dfeef2" opacity="0.10"/>
      <polygon points="260,-40 360,-40 520,460 400,460" fill="#dfeef2" opacity="0.14"/>
      <polygon points="420,-40 470,-40 560,460 480,460" fill="#eef8fa" opacity="0.10"/>
    </g>
    <rect x="0" y="0" width="1200" height="420" fill="url(#glow)"/>

    <!-- faint vertical silhouettes, evoking bamboo trunks -->
    <g opacity="0.28" filter="url(#lightBlur)">
      <rect x="10" y="-10" width="10" height="440" fill="#0d151a"/>
      <rect x="55" y="-10" width="7" height="440" fill="#0d151a"/>
      <rect x="95" y="-10" width="12" height="440" fill="#0d151a"/>
      <rect x="150" y="-10" width="8" height="440" fill="#0d151a"/>
      <rect x="1130" y="-10" width="9" height="440" fill="#0d151a"/>
      <rect x="1085" y="-10" width="11" height="440" fill="#0d151a"/>
      <rect x="1040" y="-10" width="7" height="440" fill="#0d151a"/>
    </g>

    <rect x="0" y="0" width="1200" height="420" fill="url(#vignette)"/>

    <!-- divider -->
    <line x1="470" y1="46" x2="470" y2="374" stroke="#cfe1e6" stroke-opacity="0.12" stroke-width="1"/>

    <!-- ===== LEFT: glass avatar + login-style fields ===== -->
    <g transform="translate(150,60)">
      <!-- avatar glass tile -->
      <rect x="0" y="0" width="150" height="150" rx="14" fill="url(#glassTile)" stroke="url(#glassEdge)" stroke-width="1.5"/>
      <rect x="4" y="4" width="142" height="60" rx="10" fill="#ffffff" opacity="0.18"/>
      <text x="75" y="98" text-anchor="middle" font-family="Segoe UI, Consolas, sans-serif" font-size="58" font-weight="600" fill="#eaf4f7" opacity="0.9">F</text>

      <!-- name / role pill fields -->
      <g transform="translate(0,176)">
        <rect width="270" height="30" rx="4" fill="url(#fieldGlass)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
        <text x="12" y="20" font-family="Segoe UI, Consolas, sans-serif" font-size="13.5" fill="#26343c">Firdaws Abiderrahmane</text>
      </g>
      <g transform="translate(0,214)">
        <rect width="270" height="30" rx="4" fill="url(#fieldGlass)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
        <text x="12" y="20" font-family="Segoe UI, Consolas, sans-serif" font-size="13.5" fill="#26343c">Étudiante en cybersécurité</text>
        <circle cx="288" cy="15" r="15" fill="url(#arrowBtn)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
        <path d="M283,15 L293,15 M289,10 L294,15 L289,20" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <text x="0" y="270" font-family="Segoe UI, Consolas, sans-serif" font-size="12" fill="#cfe1e6" opacity="0.85">BTS CIEL IR — obtenu 2026 · Lyon, France</text>
    </g>

    <!-- bottom-left corner glass icon -->
    <g transform="translate(24,372)">
      <circle cx="12" cy="12" r="14" fill="#1c2933" fill-opacity="0.55" stroke="#cfe1e6" stroke-opacity="0.4" stroke-width="1"/>
      <path d="M12,5 a7,7 0 1 0 0.01,0" fill="none" stroke="#cfe1e6" stroke-width="1.3" opacity="0.85"/>
      <circle cx="12" cy="12" r="2.4" fill="#cfe1e6" opacity="0.85"/>
    </g>

    <!-- ===== RIGHT: glass content panel ===== -->
    <rect x="500" y="46" width="666" height="328" rx="12" fill="#0f1a20" fill-opacity="0.32" stroke="#cfe1e6" stroke-opacity="0.22" stroke-width="1"/>
    <rect x="500" y="46" width="666" height="46" rx="12" fill="#ffffff" fill-opacity="0.06"/>

    <text x="524" y="76" font-family="Segoe UI, Consolas, sans-serif" font-size="20" font-weight="600" fill="#f2f9fb">namgeko@cybersec</text>

    <g transform="translate(524,108)" font-family="Segoe UI, Consolas, sans-serif" font-size="13">
      <rect width="618" height="26" rx="5" fill="url(#fieldGlass)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
      <text x="10" y="18" fill="#26343c">Recherche : alternance ingénieur cybersécurité — sept./oct. 2026</text>
    </g>
    <g transform="translate(524,140)" font-family="Segoe UI, Consolas, sans-serif" font-size="13">
      <rect width="618" height="26" rx="5" fill="url(#fieldGlass)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
      <text x="10" y="18" fill="#26343c">firdaws.abiderrahmane@yahoo.com</text>
    </g>

    <text x="524" y="200" font-family="Segoe UI, Consolas, sans-serif" font-size="12" fill="#cfe1e6" opacity="0.8">Stack &amp; outils</text>

    <g font-family="Segoe UI, Consolas, sans-serif" font-size="12" fill="#eaf4f7">
      <g transform="translate(524,210)"><rect width="93" height="27" rx="13.5" fill="url(#badgeGlass)" stroke="#cfe1e6" stroke-opacity="0.45" stroke-width="1"/><text x="46.5" y="18" text-anchor="middle">Wazuh SIEM</text></g>
      <g transform="translate(627,210)"><rect width="55" height="27" rx="13.5" fill="url(#badgeGlass)" stroke="#cfe1e6" stroke-opacity="0.45" stroke-width="1"/><text x="27.5" y="18" text-anchor="middle">Nmap</text></g>
      <g transform="translate(692,210)"><rect width="88" height="27" rx="13.5" fill="url(#badgeGlass)" stroke="#cfe1e6" stroke-opacity="0.45" stroke-width="1"/><text x="44" y="18" text-anchor="middle">Wireshark</text></g>
      <g transform="translate(790,210)"><rect width="95" height="27" rx="13.5" fill="url(#badgeGlass)" stroke="#cfe1e6" stroke-opacity="0.45" stroke-width="1"/><text x="47.5" y="18" text-anchor="middle">Metasploit</text></g>
      <g transform="translate(895,210)"><rect width="58" height="27" rx="13.5" fill="url(#badgeGlass)" stroke="#cfe1e6" stroke-opacity="0.45" stroke-width="1"/><text x="29" y="18" text-anchor="middle">Linux</text></g>
      <g transform="translate(963,210)"><rect width="140" height="27" rx="13.5" fill="url(#badgeGlass)" stroke="#cfe1e6" stroke-opacity="0.45" stroke-width="1"/><text x="70" y="18" text-anchor="middle">Active Directory</text></g>

      <g transform="translate(524,246)"><rect width="76" height="27" rx="13.5" fill="url(#badgeGlass)" stroke="#cfe1e6" stroke-opacity="0.45" stroke-width="1"/><text x="38" y="18" text-anchor="middle">Proxmox</text></g>
      <g transform="translate(610,246)"><rect width="82" height="27" rx="13.5" fill="url(#badgeGlass)" stroke="#cfe1e6" stroke-opacity="0.45" stroke-width="1"/><text x="41" y="18" text-anchor="middle">VLAN/VPN</text></g>
      <g transform="translate(702,246)"><rect width="104" height="27" rx="13.5" fill="url(#badgeGlass)" stroke="#cfe1e6" stroke-opacity="0.45" stroke-width="1"/><text x="52" y="18" text-anchor="middle">C++ / ESP32</text></g>
      <g transform="translate(816,246)"><rect width="48" height="27" rx="13.5" fill="url(#badgeGlass)" stroke="#cfe1e6" stroke-opacity="0.45" stroke-width="1"/><text x="24" y="18" text-anchor="middle">SQL</text></g>
      <g transform="translate(874,246)"><rect width="95" height="27" rx="13.5" fill="url(#badgeGlass)" stroke="#cfe1e6" stroke-opacity="0.45" stroke-width="1"/><text x="47.5" y="18" text-anchor="middle">Kali Linux</text></g>
      <g transform="translate(979,246)"><rect width="98" height="27" rx="13.5" fill="url(#badgeGlass)" stroke="#cfe1e6" stroke-opacity="0.45" stroke-width="1"/><text x="49" y="18" text-anchor="middle">RADIUS/NPS</text></g>
    </g>

    <!-- Cancel-style pill button, repurposed as links row -->
    <g transform="translate(524,300)">
      <rect width="618" height="36" rx="18" fill="url(#fieldGlass)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
      <text x="309" y="23" text-anchor="middle" font-family="Segoe UI, Consolas, sans-serif" font-size="13" fill="#26343c">github.com/Namgeko&#160;&#160;·&#160;&#160;linkedin.com/in/firdawsabiderrahmane</text>
    </g>

    <!-- bottom caption, echoing the Windows 7 wordmark placement -->
    <text x="524" y="358" font-family="Segoe UI, Consolas, sans-serif" font-size="14" fill="#eaf4f7" opacity="0.9">Namgeko <tspan fill="#cfe1e6" opacity="0.75" font-weight="300">— Cybersécurité</tspan></text>

    <!-- bottom-right corner glass icon (accent, decorative) -->
    <g transform="translate(1150,372)">
      <circle cx="12" cy="12" r="14" fill="#7fc2da" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
      <path d="M12,6 L12,13 M8.5,8.2 a6,6 0 1 0 7,0" stroke="#0f1a20" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </g>

    <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#cfe1e6" stroke-opacity="0.18" stroke-width="1.2"/>
  </g>
</svg>
